services:
  # PostgreSQL Database Service (PostgreSQL 15)
  postgres:
    image: postgres:15
    container_name: resumix_db
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-resumix} || pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resumix_network

  # Express Backend API Service (Node.js Alpine)
  server:
    image: resumix-server:${APP_VERSION}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resumix_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: ${SERVER_PORT}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - resumix_uploads:/app/public/uploads
    networks:
      - resumix_network

  # React Frontend Service (Nginx Alpine)
  client:
    image: resumix-client:${APP_VERSION}
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_SAWERIA_URL: ${VITE_SAWERIA_URL}
        VITE_FEEDBACK_EMAIL: ${VITE_FEEDBACK_EMAIL}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL}
        VITE_CONTACT_GITHUB: ${VITE_CONTACT_GITHUB}
        VITE_CONTACT_INSTAGRAM: ${VITE_CONTACT_INSTAGRAM}
    container_name: resumix_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    env_file:
      - ./client/.env
    environment:
      BACKEND_PORT: ${SERVER_PORT}
      NGINX_ENVSUBST_FILTER: BACKEND_PORT
    ports:
      - "${CLIENT_PORT}:80"
    networks:
      - resumix_network

volumes:
  postgres_data:
    driver: local
  resumix_uploads:
    driver: local

networks:
  resumix_network:
    driver: bridge
